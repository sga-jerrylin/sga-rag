include:
  - ./docker-compose-base.yml
# To ensure that the container processes the locally modified `service_conf.yaml.template` instead of the one included in its image, you need to mount the local `service_conf.yaml.template` to the container.
services:
  ragflow-cpu:
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE}
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/ragflow/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Enable Admin server + auto-create superuser on first boot
    command:
      - --enable-adminserver
      - --init-superuser
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
      - ${GO_HTTP_PORT}:9384
      - ${GO_ADMIN_PORT}:9385
    volumes:
      - ./ragflow-logs:/ragflow/logs
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../web/dist:/ragflow/web/dist
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
      - ../rag/res:/ragflow/rag/res
      - ../api/apps/user_app.py:/ragflow/api/apps/user_app.py
      - ../api/apps/llm_app.py:/ragflow/api/apps/llm_app.py
      - ../api/db/init_data.py:/ragflow/api/db/init_data.py
      - ../api/db/db_models.py:/ragflow/api/db/db_models.py
      - ../api/common/base64.py:/ragflow/api/common/base64.py
      - ../rag/llm/chat_model.py:/ragflow/rag/llm/chat_model.py
      - ../rag/llm/embedding_model.py:/ragflow/rag/llm/embedding_model.py
      - ../admin/server/auth.py:/ragflow/admin/server/auth.py
      - ../admin/server/routes.py:/ragflow/admin/server/routes.py
      - ../api/db/services/system_setting_service.py:/ragflow/api/db/services/system_setting_service.py
      - ../api/db/services/tenant_llm_service.py:/ragflow/api/db/services/tenant_llm_service.py
      - uv_tools_data:/ragflow/uv_tools
      - venv_data:/ragflow/.venv
    env_file: .env
    networks:
      - km
    restart: on-failure
    shm_size: '4gb'
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ragflow-gpu:
    depends_on:
      mysql:
        condition: service_healthy
    profiles:
      - gpu
    image: ${RAGFLOW_IMAGE}
    # Example configuration to set up an MCP server:
    # command:
    #   - --enable-mcpserver
    #   - --mcp-host=0.0.0.0
    #   - --mcp-port=9382
    #   - --mcp-base-url=http://127.0.0.1:9380
    #   - --mcp-script-path=/ragflow/mcp/server/server.py
    #   - --mcp-mode=self-host
    #   - --mcp-host-api-key=ragflow-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    # Optional transport flags for MCP (customize if needed).
    # Host mode need to combined with --no-transport-streamable-http-enabled flag, namely, host+streamable-http is not supported yet.
    # The following are enabled by default unless explicitly disabled with --no-<flag>.
    #   - --no-transport-sse-enabled # Disable legacy SSE endpoints (/sse and /messages/)
    #   - --no-transport-streamable-http-enabled #  Disable Streamable HTTP transport (/mcp endpoint)
    #   - --no-json-response # Disable JSON response mode in Streamable HTTP transport (instead of SSE over HTTP)

    # Enable Admin server + auto-create superuser on first boot
    command:
      - --enable-adminserver
      - --init-superuser
      - --workers=1
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      - ${SVR_WEB_HTTPS_PORT}:443
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
      - ${SVR_MCP_PORT}:9382 # entry for MCP (host_port:docker_port). The docker_port must match the value you set for `mcp-port` above.
    volumes:
      - ./ragflow-logs:/ragflow/logs
      - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ../web/dist:/ragflow/web/dist
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
      - ../rag/res:/ragflow/rag/res
      - ../api/apps/user_app.py:/ragflow/api/apps/user_app.py
      - ../api/apps/llm_app.py:/ragflow/api/apps/llm_app.py
      - ../api/db/init_data.py:/ragflow/api/db/init_data.py
      - ../api/db/db_models.py:/ragflow/api/db/db_models.py
      - ../api/common/base64.py:/ragflow/api/common/base64.py
      - ../rag/llm/chat_model.py:/ragflow/rag/llm/chat_model.py
      - ../rag/llm/embedding_model.py:/ragflow/rag/llm/embedding_model.py
      - ../admin/server/auth.py:/ragflow/admin/server/auth.py
      - ../admin/server/routes.py:/ragflow/admin/server/routes.py
      - ../api/db/services/system_setting_service.py:/ragflow/api/db/services/system_setting_service.py
      - ../api/db/services/tenant_llm_service.py:/ragflow/api/db/services/tenant_llm_service.py
      - uv_tools_data:/ragflow/uv_tools
      - venv_data:/ragflow/.venv
    env_file: .env
    networks:
      - km
    restart: on-failure
    shm_size: '4gb'
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]


